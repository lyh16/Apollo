name: build release

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      apollo_ipa_url:
        description: 'Apollo .ipa URL (defaults to the base 1.15.11 IPA hosted on this repo)'
        required: false
        default: 'https://github.com/lyh16/Apollo/releases/download/base-ipa/base-apollo-1.15.11.ipa'
      catbox_upload:
        description: 'Upload built IPAs to Catbox.moe and list the mirror URLs in the job summary'
        type: boolean
        default: false
      sync_catalogs_only:
        description: 'Skip the build and only re-sync the source JSONs against existing releases'
        type: boolean
        default: false
  schedule:
    # Runs every 6 hours to check for new releases
    - cron: '0 */6 * * *'

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.13'
  # Base Apollo 1.15.11 IPA (frozen). Mirrored off the ephemeral catbox.moe host
  # to a prerelease asset on this repo (tag `base-ipa`) so builds no longer break
  # if the free host purges the file. The asset name (base-*) is deliberately
  # outside the Apollo/NO-EXTENSIONS/GLASS prefixes so update_json.py ignores it.
  APOLLO_IPA_URL: ${{ inputs.apollo_ipa_url || 'https://github.com/lyh16/Apollo/releases/download/base-ipa/base-apollo-1.15.11.ipa' }}
  # Boolean inputs render as 'true'/'false' (empty on schedule/workflow_call).
  # The previous gate compared the boolean against the string 'false', which
  # GitHub expressions never evaluate true, so the upload step was dead code.
  CATBOX_UPLOAD: ${{ inputs.catbox_upload }}
  # Upstream tweak. Formerly JeffreyCA/Apollo-ImprovedCustomApi; as of 2026-05-22
  # it rebranded to the community-maintained Apollo-Reborn/Apollo-Reborn org.
  # The old path still 301-redirects here, but we point at the canonical repo
  # directly so we don't depend on the redirect (curl keeps -L as a safety net).
  GITHUB_API_URL: "https://api.github.com/repos/Apollo-Reborn/Apollo-Reborn/releases/latest"
  PYZULE_RW_URL: "https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip"

jobs:
  check-new-release:
    runs-on: ubuntu-latest
    outputs:
      should_build:  ${{ steps.check.outputs.should_build }}
      release_tag:   ${{ steps.check.outputs.release_tag }}
      release_notes: ${{ steps.check.outputs.release_notes }}
      deb_url:       ${{ steps.check.outputs.deb_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for new release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Poll upstream /releases/latest with retries. `-L` follows the 301
          # GitHub serves when the upstream repo is renamed or transferred
          # (which is what caused the previous `jq: Cannot iterate over null
          # (null)` failure — the response was a redirect body, not a release
          # object).
          attempt=0
          while :; do
            attempt=$((attempt+1))
            STATUS=$(curl -sSL -o response.json -w '%{http_code}' \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "${{ env.GITHUB_API_URL }}" || echo "000")
            echo "Attempt $attempt: HTTP $STATUS"

            if [ "$STATUS" = "200" ]; then
              break
            fi

            if [ "$attempt" -ge 5 ]; then
              echo "::error::Upstream poll failed after $attempt attempts (HTTP $STATUS)."
              echo "Response body:"
              cat response.json || true
              exit 1
            fi
            sleep $((2 ** attempt))
          done

          # Validate shape before piping to jq so error bodies (rate limit,
          # redirect HTML, 404 page) surface a readable message instead of
          # a jq trace.
          if [ "$(jq -r 'type' response.json)" != "object" ] \
              || [ "$(jq -r '.assets | type' response.json)" != "array" ]; then
            echo "::error::Unexpected response from upstream API:"
            cat response.json
            exit 1
          fi

          LATEST_TAG=$(jq -r '.tag_name' response.json)
          RELEASE_NOTES=$(jq -r '.body // ""' response.json)
          DEB_URL=$(jq -r '.assets[]
              | select(.name | test("iphoneos-arm64_rootless\\.deb$"))
              | .browser_download_url' response.json)

          if [ -z "$DEB_URL" ] || [ "$DEB_URL" = "null" ]; then
            echo "::error::Release $LATEST_TAG has no iphoneos-arm64_rootless.deb asset."
            exit 1
          fi

          echo "Latest external release: $LATEST_TAG"
          echo "DEB URL:                 $DEB_URL"

          # Get the latest release tag from this repo (also -L for safety).
          CURRENT_TAG=$(curl -sSL -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/latest" \
            | jq -r '.tag_name // empty')
          echo "Current repo release: $CURRENT_TAG"

          # The "tweak version" is the SemVer that actually changes between
          # releases and that SideStore compares. Both the upstream tag
          # (Apollo-Reborn uses `v<apollo>_<tweak>`, e.g. v1.15.11_3.0.0) and our
          # own release tag share that `<apollo>_<tweak>` shape, so the tweak
          # version is the trailing `_`-separated token with any leading `v`
          # stripped. The legacy upstream form `v<tweak>` (e.g. v2.14.0) has no
          # underscore and passes through unchanged.
          tweak_version() { local t="${1#v}"; printf '%s' "${t##*_}"; }

          if [ -n "$CURRENT_TAG" ]; then
            CURRENT_ICA_VERSION=$(tweak_version "$CURRENT_TAG")
          else
            CURRENT_ICA_VERSION=""
          fi

          LATEST_ICA_VERSION=$(tweak_version "$LATEST_TAG")

          echo "Current tweak version: $CURRENT_ICA_VERSION"
          echo "Latest tweak version:  $LATEST_ICA_VERSION"

          if [ "${{ inputs.sync_catalogs_only }}" = "true" ]; then
            echo "sync_catalogs_only requested - skipping build (sync-catalogs job will run)"
            should_build=false
          elif [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Manual or workflow_call trigger - building"
            should_build=true
          elif [ -z "$CURRENT_ICA_VERSION" ]; then
            echo "No existing release found - building"
            should_build=true
          elif [ "$LATEST_ICA_VERSION" != "$CURRENT_ICA_VERSION" ]; then
            echo "New release detected - building"
            should_build=true
          else
            echo "No new release - skipping build"
            should_build=false
          fi

          {
            echo "should_build=$should_build"
            echo "release_tag=$LATEST_TAG"
            echo "deb_url=$DEB_URL"
            echo "release_notes<<__EOF__"
            echo "$RELEASE_NOTES"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

  build-apollo-ipa:
    needs: check-new-release
    if: needs.check-new-release.outputs.should_build == 'true'
    runs-on: macos-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: "${{ env.PYTHON_VERSION}}"

      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          pip install --force-reinstall "${{ env.PYZULE_RW_URL }}"

      - name: Install ldid
        run: brew install ldid

      - name: Forward release info from upstream poll
        id: get-release
        # Reuse the values already validated by the `check-new-release` job
        # instead of re-fetching (and risking the same redirect / null-jq
        # failure mode in a second place).
        env:
          RELEASE_TAG:   ${{ needs.check-new-release.outputs.release_tag }}
          RELEASE_NOTES: ${{ needs.check-new-release.outputs.release_notes }}
          DEB_URL:       ${{ needs.check-new-release.outputs.deb_url }}
        run: |
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          {
            echo "RELEASE_NOTES<<EOF"
            echo "$RELEASE_NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "DEB_URL=${DEB_URL}" >> "$GITHUB_OUTPUT"

      - name: Download apollo .ipa and improvedcustomapi .deb
        id: download-files
        env:
          DEB_URL: ${{ steps.get-release.outputs.DEB_URL }}
          RELEASE_TAG: ${{ steps.get-release.outputs.RELEASE_TAG }}
        run: |
          curl -L "$APOLLO_IPA_URL" -o Apollo.ipa
          APOLLO_VERSION=$(unzip -p Apollo.ipa 'Payload/*.app/Info.plist' | grep -A1 'CFBundleShortVersionString' | grep string | sed -E 's/<string>(.*)<\/string>/\1/' | tr -d '[:space:]')

          curl -L "$DEB_URL" -o improvedcustomapi.deb

          # Tweak (Apollo-Reborn) version = trailing `_`-separated token of the
          # upstream tag, leading `v` stripped. Upstream now tags releases as
          # `v<apollo>_<tweak>` (e.g. v1.15.11_3.0.0 -> 3.0.0); the legacy
          # `v<tweak>` form (e.g. v2.14.0) has no underscore and passes through.
          # Taking the whole post-`v` string here is what produced the doubled
          # tag v1.15.11_1.15.11_3.0.0 and the non-SemVer CFBundleShortVersionString
          # that broke SideStore update detection.
          ICA_VERSION="${RELEASE_TAG#v}"
          ICA_VERSION="${ICA_VERSION##*_}"

          echo "APOLLO_VERSION=${APOLLO_VERSION}" >> "$GITHUB_OUTPUT"
          echo "ICA_VERSION=$ICA_VERSION" >> "$GITHUB_OUTPUT"
          echo "OUTPUT_NAME=Apollo-${APOLLO_VERSION}_ImprovedCustomApi-${ICA_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Setup build folders
        env:
            OUTPUT_NAME: ${{ steps.download-files.outputs.OUTPUT_NAME }}
        run: |
          mkdir -p "${OUTPUT_NAME}/Payload"
          mkdir -p "NO-EXTENSIONS_${OUTPUT_NAME}/Payload"

      - name: Build modified .ipa
        env:
            OUTPUT_NAME: ${{ steps.download-files.outputs.OUTPUT_NAME }}
            ICA_VERSION: ${{ steps.download-files.outputs.ICA_VERSION }}
            APOLLO_VERSION: ${{ steps.download-files.outputs.APOLLO_VERSION }}
        working-directory: ${{ steps.download-files.outputs.OUTPUT_NAME }}
        run: |
          cyan -i "${GITHUB_WORKSPACE}/Apollo.ipa" -o "Payload/Apollo.app" -f "${GITHUB_WORKSPACE}/improvedcustomapi.deb" --fakesign

          # Apply Dystopia patches (URL scheme + App Group fix)
          bash "${GITHUB_WORKSPACE}/dystopia-patch.sh"

          # SideStore detects updates via CFBundleShortVersionString (SemVer compare).
          # Apollo's own version is frozen, so we surface ICA as the public version
          # and keep Apollo's version in CFBundleVersion for reference.
          echo "Setting CFBundleShortVersionString to ${ICA_VERSION}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${ICA_VERSION}" "Payload/Apollo.app/Info.plist"

          echo "Setting CFBundleVersion to ${APOLLO_VERSION}"
          if /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "Payload/Apollo.app/Info.plist" 2>/dev/null; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${APOLLO_VERSION}" "Payload/Apollo.app/Info.plist"
          else
            /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string ${APOLLO_VERSION}" "Payload/Apollo.app/Info.plist"
          fi

          SHORT_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "Payload/Apollo.app/Info.plist")
          BUILD_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "Payload/Apollo.app/Info.plist")
          echo "CFBundleShortVersionString is now: ${SHORT_VERSION}"
          echo "CFBundleVersion is now: ${BUILD_VERSION}"

          echo "Zipping ${OUTPUT_NAME}.ipa"
          zip -6 -rq "${OUTPUT_NAME}.ipa" "Payload" -x "*/.*"

          echo "Updating build version in Apollo Executable!"
          echo "Previous $(vtool -show-build Payload/Apollo.app/Apollo)"
          vtool -set-build-version ios 15.0 19.0 -replace -output "Payload/Apollo.app/Apollo" "Payload/Apollo.app/Apollo"
          echo "Updated $(vtool -show-build Payload/Apollo.app/Apollo)"

          echo "Checking for duplicate LC_RPATH entries..."
          executable_path_count=$(otool -l "Payload/Apollo.app/Apollo" | grep -A 2 LC_RPATH | grep "@executable_path/Frameworks" | wc -l | tr -d ' ')
          echo "Found $executable_path_count @executable_path/Frameworks LC_RPATH entries"
          if [ "$executable_path_count" -gt 1 ]; then
            echo "Removing duplicate @executable_path/Frameworks LC_RPATH entry..."
            install_name_tool -delete_rpath "@executable_path/Frameworks" "Payload/Apollo.app/Apollo"
            echo "Duplicate LC_RPATH entry removed"
          fi

          echo "Fake Signing Apollo Executable!"
          ldid -S -M "Payload/Apollo.app/Apollo"

          # Re-apply App Group fix after ldid re-signed
          bash "${GITHUB_WORKSPACE}/dystopia-patch.sh"

          echo "Zipping GLASS_${OUTPUT_NAME}.ipa"
          zip -6 -rq "GLASS_${OUTPUT_NAME}.ipa" "Payload" -x "*/.*"

      - name: Build no extension modified .ipa
        env:
            OUTPUT_NAME: ${{ steps.download-files.outputs.OUTPUT_NAME }}
            ICA_VERSION: ${{ steps.download-files.outputs.ICA_VERSION }}
            APOLLO_VERSION: ${{ steps.download-files.outputs.APOLLO_VERSION }}
        working-directory: NO-EXTENSIONS_${{ steps.download-files.outputs.OUTPUT_NAME }}
        run: |
          cyan -i "${GITHUB_WORKSPACE}/Apollo.ipa" -o "Payload/Apollo.app" -f "${GITHUB_WORKSPACE}/improvedcustomapi.deb" --fakesign -e

          # Apply Dystopia patches (URL scheme + App Group fix)
          bash "${GITHUB_WORKSPACE}/dystopia-patch.sh"

          # SideStore detects updates via CFBundleShortVersionString (SemVer compare).
          # Apollo's own version is frozen, so we surface ICA as the public version
          # and keep Apollo's version in CFBundleVersion for reference.
          echo "Setting CFBundleShortVersionString to ${ICA_VERSION}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${ICA_VERSION}" "Payload/Apollo.app/Info.plist"

          echo "Setting CFBundleVersion to ${APOLLO_VERSION}"
          if /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "Payload/Apollo.app/Info.plist" 2>/dev/null; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${APOLLO_VERSION}" "Payload/Apollo.app/Info.plist"
          else
            /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string ${APOLLO_VERSION}" "Payload/Apollo.app/Info.plist"
          fi

          SHORT_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "Payload/Apollo.app/Info.plist")
          BUILD_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "Payload/Apollo.app/Info.plist")
          echo "CFBundleShortVersionString is now: ${SHORT_VERSION}"
          echo "CFBundleVersion is now: ${BUILD_VERSION}"

          echo "Zipping NO-EXTENSIONS_${OUTPUT_NAME}.ipa"
          zip -6 -rq "NO-EXTENSIONS_${OUTPUT_NAME}.ipa" "Payload" -x "*/.*"

          echo "Updating build version in Apollo Executable!"
          echo "Previous $(vtool -show-build Payload/Apollo.app/Apollo)"
          vtool -set-build-version ios 15.0 19.0 -replace -output "Payload/Apollo.app/Apollo" "Payload/Apollo.app/Apollo"
          echo "Updated $(vtool -show-build Payload/Apollo.app/Apollo)"

          echo "Checking for duplicate LC_RPATH entries..."
          executable_path_count=$(otool -l "Payload/Apollo.app/Apollo" | grep -A 2 LC_RPATH | grep "@executable_path/Frameworks" | wc -l | tr -d ' ')
          echo "Found $executable_path_count @executable_path/Frameworks LC_RPATH entries"
          if [ "$executable_path_count" -gt 1 ]; then
            echo "Removing duplicate @executable_path/Frameworks LC_RPATH entry..."
            install_name_tool -delete_rpath "@executable_path/Frameworks" "Payload/Apollo.app/Apollo"
            echo "Duplicate LC_RPATH entry removed"
          fi

          echo "Fake Signing Apollo Executable!"
          ldid -S -M "Payload/Apollo.app/Apollo"

          # Re-apply App Group fix after ldid re-signed
          bash "${GITHUB_WORKSPACE}/dystopia-patch.sh"

          echo "Zipping NO-EXTENSIONS_GLASS_${OUTPUT_NAME}.ipa"
          zip -6 -rq "NO-EXTENSIONS_GLASS_${OUTPUT_NAME}.ipa" "Payload" -x "*/.*"

      - name: Generate release notes
        env:
          APOLLO_VERSION: ${{ steps.download-files.outputs.APOLLO_VERSION }}
          RELEASE_TAG: ${{ steps.get-release.outputs.RELEASE_TAG }}
          RELEASE_NOTES: ${{ steps.get-release.outputs.RELEASE_NOTES }}
        run: |
          if [ -z "${APOLLO_VERSION}" ] || [ -z "${RELEASE_TAG}" ] || [ -z "${RELEASE_NOTES}" ]; then
            echo "Error: Missing required information for generating release notes!"
            exit 1
          fi

          {
            echo "Apollo version: \`v${APOLLO_VERSION}\`"
            echo "Apollo-Reborn version: \`${RELEASE_TAG}\`"
            echo ""
            echo "## Release Notes"
            echo "$RELEASE_NOTES"
            echo "## Known Issues"
            echo "- Apollo Ultra features may cause app to crash"
            echo "- Imgur multi-image upload"
            echo "- Uploads usually fail on the first attempt but subsequent retries should succeed"
            echo "- Share URLs in private messages and long-tapping them still open in the in-app browser"
          } >> RELEASE_NOTES.md

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.download-files.outputs.APOLLO_VERSION }}_${{ steps.download-files.outputs.ICA_VERSION }}
          name: Apollo v${{ steps.download-files.outputs.APOLLO_VERSION }} with Apollo-Reborn v${{ steps.download-files.outputs.ICA_VERSION }}
          body_path: RELEASE_NOTES.md
          files: |
            ${{ steps.download-files.outputs.OUTPUT_NAME }}/${{ steps.download-files.outputs.OUTPUT_NAME }}.ipa
            ${{ steps.download-files.outputs.OUTPUT_NAME }}/GLASS_${{ steps.download-files.outputs.OUTPUT_NAME }}.ipa
            NO-EXTENSIONS_${{ steps.download-files.outputs.OUTPUT_NAME }}/NO-EXTENSIONS_${{ steps.download-files.outputs.OUTPUT_NAME }}.ipa
            NO-EXTENSIONS_${{ steps.download-files.outputs.OUTPUT_NAME }}/NO-EXTENSIONS_GLASS_${{ steps.download-files.outputs.OUTPUT_NAME }}.ipa

      - name: Upload to catbox
        if: env.CATBOX_UPLOAD == 'true'
        env:
          OUTPUT_NAME: ${{ steps.download-files.outputs.OUTPUT_NAME }}
          APOLLO_VERSION: ${{ steps.download-files.outputs.APOLLO_VERSION }}
          ICA_VERSION: ${{ steps.download-files.outputs.ICA_VERSION }}
        run: |
          set -euo pipefail
          if [ -z "${APOLLO_VERSION}" ] || [ -z "${ICA_VERSION}" ]; then
            echo "Error: Missing required information for uploading to Catbox!"
            exit 1
          fi

          # Catbox's API returns the bare file URL on success and an error
          # string otherwise (still HTTP 200), so validate the body shape.
          upload() {
            local file="$1" url
            url=$(curl -sS -F "reqtype=fileupload" -F "fileToUpload=@${file}" https://catbox.moe/user/api.php)
            case "$url" in
              https://*) printf '%s' "$url" ;;
              *) echo "::error::Catbox upload failed for ${file}: ${url}" >&2; return 1 ;;
            esac
          }

          CATBOX_URL=$(upload "${OUTPUT_NAME}/${OUTPUT_NAME}.ipa")
          CATBOX_URL_GLASS=$(upload "${OUTPUT_NAME}/GLASS_${OUTPUT_NAME}.ipa")
          CATBOX_URL_NO_EXT=$(upload "NO-EXTENSIONS_${OUTPUT_NAME}/NO-EXTENSIONS_${OUTPUT_NAME}.ipa")
          CATBOX_URL_NO_EXT_GLASS=$(upload "NO-EXTENSIONS_${OUTPUT_NAME}/NO-EXTENSIONS_GLASS_${OUTPUT_NAME}.ipa")

          {
            echo "### 📦 Catbox mirrors"
            echo "- Standard: ${CATBOX_URL}"
            echo "- GLASS: ${CATBOX_URL_GLASS}"
            echo "- NO-EXTENSIONS: ${CATBOX_URL_NO_EXT}"
            echo "- NO-EXTENSIONS GLASS: ${CATBOX_URL_NO_EXT_GLASS}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update source files
        env:
          RELEASE_TAG: ${{ steps.get-release.outputs.RELEASE_TAG }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'

          git fetch origin main
          git checkout main
          git pull origin main

          python update_json.py

          git add apps.json apps_noext.json apps_glass.json apps_noext_glass.json

          if git diff --cached --quiet; then
            echo "No changes detected, skipping commit."
          else
            git commit -m "update source files for $RELEASE_TAG"
            git push origin main || (git pull --rebase origin main && git push origin main)
          fi

      - name: Job summary
        run: |
          echo "### 📊 Workflow Summary" >> $GITHUB_STEP_SUMMARY
          echo "✅ New release created: v${{ steps.download-files.outputs.APOLLO_VERSION }}-${{ steps.download-files.outputs.ICA_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "🔗 [View release](https://github.com/${{ github.repository }}/releases/tag/v${{ steps.download-files.outputs.APOLLO_VERSION }}_${{ steps.download-files.outputs.ICA_VERSION }})" >> $GITHUB_STEP_SUMMARY

  sync-catalogs:
    # Self-heal for catalog drift: the build job publishes the release BEFORE
    # committing the regenerated source JSONs, and the two steps aren't atomic.
    # If the JSON commit ever fails after the release goes up, later scheduled
    # runs see "release already built", skip, and the catalogs stay stale
    # forever. update_json.py regenerates all four catalogs deterministically
    # from this repo's releases, so whenever the build is skipped we re-run it
    # and commit only if anything drifted (normally a ~30s no-op).
    needs: check-new-release
    if: needs.check-new-release.outputs.should_build == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: "${{ env.PYTHON_VERSION }}"

      - name: Regenerate catalogs and commit any drift
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pip install requests
          python update_json.py

          git add apps.json apps_noext.json apps_glass.json apps_noext_glass.json
          if git diff --cached --quiet; then
            echo "Catalogs already in sync with releases."
          else
            git config user.name 'GitHub Action'
            git config user.email 'action@github.com'
            git commit -m "fix(catalogs): re-sync source JSONs with published releases"
            git push origin main || (git pull --rebase origin main && git push origin main)
          fi